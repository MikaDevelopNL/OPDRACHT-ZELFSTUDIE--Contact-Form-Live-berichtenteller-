<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Live berichtenteller</title>
		<link rel="stylesheet" href="style.css"/>
	</head>
	<body>
		<main class="main">
			<h1 class="title">Contact Formulier</h1>
			<form class="formulier">
				<h2>Vraag maar raak?</h2>
				<div class="contact">
					<label for="name">Volledige Naam:</label>
					<input type="text" id="name" name="name" required placeholder="Piet Verdriet" maxlength="25">
					<p class="name-counter">0 / 25</p>
				</div>
				<div class="contact">
					<label for="email">E-mail:</label>
					<input type="email" id="email" name="email" required placeholder="piet@hotmail.com"> 
				</div>
				<div class="contact">
					<label for="remark">Opmerking</label>
					<textarea id="remark" name="remark" placeholder="Typ hier u opmerking..." maxlength="50" rows="3"></textarea>
					<p class="counter">0 / 50</p>
				</div>
				
				<button type="submit" class="btn">Klik voor verzending</button>
			</form>
		</main>
		<script src="script.js"></script>
	</body>
</html>
