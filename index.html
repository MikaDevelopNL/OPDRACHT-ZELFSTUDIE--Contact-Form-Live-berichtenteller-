<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Live berichtenteller</title>
		<link rel="stylesheet" href="style.css"/>
	</head>
	<body>
		<main class="main">
			<h1 class="title">Contact Formulier</h1>
			<div class="container">
				<h2>Vraag maar raak?</h2>
				<div class="contact">
					<label for="name">Volledige Naam</label>
					<input type="text" id="name" name="name" required placeholder="Piet Verdriet">
				</div>
				<div class="contact">
					<label for="email">E-mail</label>
					<input type="text" id="email" name="email" required placeholder="piet@hotmail.com"> 
				</div>
				<div class="contact">
					<label for="remark">Opmerking</label>
					<textarea id="remark" name="remark" placeholder="Typ hier u opmerking..." rows="3"></textarea>
				</div>
				
				<button type="submit" class="btn">Klik voor verzending</button>
			</div>
		</main>
		<script scr="script.js"></script>
	</body>
</html>
